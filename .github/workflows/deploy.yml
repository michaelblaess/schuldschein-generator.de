name: Build & Deploy

# Jeder Push auf main deployt, von Hand geht es zusaetzlich (clean-slate nur dort)
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      clean-slate:
        description: 'Zielordner vor dem Upload komplett leeren (nur bei Bedarf)'
        type: boolean
        default: false

# Der Lauf liest nur den Quelltext, hochgeladen wird per FTPS und nicht ueber das Token
permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # Volle Historie: die Sitemap nimmt lastmod aus git log, mit einem Commit trueg jede Seite dasselbe Datum
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit-Tests
        run: npm test

      - name: Build
        run: npm run build
        env:
          # Ohne Kennung baut die Seite fail-closed, ohne Banner und ohne Analytics
          PUBLIC_GA_ID: ${{ vars.PUBLIC_GA_ID }}

      - name: Livegang-Gate
        run: node pruefe-gate.mjs

      - name: Deploy via FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASSWORD }}
          # Ohne diese Zeile faellt die Action auf unverschluesseltes FTP zurueck
          protocol: ftps
          local-dir: ./dist/
          # Ordner der Domain im Webspace, kein Geheimnis
          server-dir: /schuldschein-generator.de/
          dangerous-clean-slate: ${{ inputs.clean-slate == true }}
